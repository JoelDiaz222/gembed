[package]
name = "gembed"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[features]
default = ["embed_anything"]

embed_anything = [
    "dep:embed_anything",
    "dep:tokio",
    "dep:tempfile",
    "dep:candle-core",
    "dep:candle-nn",
]

fastembed = ["dep:fastembed"]

grpc = [
    "dep:prost",
    "dep:tonic",
    "dep:tokio",
    "dep:tonic-prost",
    "dep:tonic-prost-build"
]

http = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json"
]

[dependencies]
anyhow = "1.0.100"
embed_anything = { version = "0.6.7", optional = true }
fastembed = { git = "https://github.com/JoelDiaz222/fastembed-rs", optional = true }
linkme = "0.3.35"
prost = { version = "0.14.1", optional = true }
tonic = { version = "0.14.2", optional = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread"], optional = true }
tonic-prost = { version = "0.14.2", optional = true }
tempfile = { version = "3.24.0", optional = true }
candle-core = { version = "=0.9.1", optional = true }
candle-nn = { version = "=0.9.1", optional = true }
reqwest = { version = "0.13.2", features = ["blocking", "json"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14.2", optional = true }

[profile.release]
debug = 0
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "symbols"
panic = "unwind"
