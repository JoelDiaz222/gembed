[package]
name = "gembed"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[features]
default = ["embed_anything"]

dynamic_model_loading = ["dep:lru"]

embed_anything = [
    "dep:embed_anything",
    "dep:tokio",
    "dep:tempfile",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers"
]

fastembed = ["dep:fastembed"]

ort = ["dep:ort", "dep:image"]

grpc = [
    "dep:prost",
    "dep:tonic",
    "dep:tokio",
    "dep:tonic-prost",
    "dep:tonic-prost-build"
]

http = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json"
]

[dependencies]
anyhow = "1.0.100"
embed_anything = { version = "0.6.7", optional = true }
fastembed = { version = "5.8.0", optional = true }
linkme = "0.3.35"
prost = { version = "0.14.3", optional = true }
tonic = { version = "0.14.5", optional = true }
tokio = { version = "1.50.0", features = ["rt-multi-thread"], optional = true }
tonic-prost = { version = "0.14.5", optional = true }
tempfile = { version = "3.26.0", optional = true }
candle-core = { version = "=0.9.1", optional = true }
candle-nn = { version = "=0.9.1", optional = true }
candle-transformers = { version = "=0.9.1", optional = true }
reqwest = { version = "0.13.2", features = ["blocking", "json"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
ort = { version = "=2.0.0-rc.10", features = ["load-dynamic"], optional = true}
image = { version = "0.25.10", optional = true }
lru = { version = "0.16.3", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14.5", optional = true }

[profile.release]
debug = 0
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "symbols"
panic = "unwind"
